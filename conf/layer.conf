# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-star"
BBFILE_PATTERN_meta-star = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-star = "6"

LAYERDEPENDS_meta-star = "core"
LAYERSERIES_COMPAT_meta-star = "scarthgap"
